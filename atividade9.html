<html>
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>

   <h2>Formulario</h2>

   <form action="#" method="POST">

    <!-- Campo para nome -->
    <p>
      <label for="nome">Nome:</label><br>
      <input type="text" id="nome" name="nome" placeholder="" required>
    </p>

    <!-- Campo para Endereço -->
    <p>
      <label for="endereço">Endereço:</label><br>
      <input type="endereço" id="endereço" name="endereço"
             placeholder="" required>
    </p>

    <!-- Campo para cidade -->
    <p>
      <label for="cidade">Cidade:</label><br>
      <input type="" id="cidade" name="cidade" required>
    </p>

    <!-- Campo para Estado -->
    <p>
      <label for="estado">Estado:</label><br>
      <select id="estado" name="estado">
        <option value="São paulo">São paulo</option>
        <option value="Piaui">Piaui</option>
        <option value="Pará">Pará</option>
        <option value="Bahia">Bahia</option>
      </select>
    </p>  

    <!-- Campo para seleção de cargo -->

<legend>Dados profissionais</legend>

        <p>Natureza do Cargo</p>

        <label>
            <input type="radio" name="cargo" value="gerencia" checked>
            Gerência
        </label>

        <label>
            <input type="radio" name="cargo" value="financeiro">
            Financeiro
        </label>

        <label>
            <input type="radio" name="cargo" value="recepcao">
            Recepção
        </label>

        <label>
            <input type="radio" name="cargo" value="administrativo">
            Administrativo
        </label>

        <label>
            <input type="radio" name="cargo" value="juridico">
            Jurídico
        </label>

        <br><br>

        <!-- Campo para  selecionar área de interesse -->     
  <p>Área de interesse</p>

        <label>
            <input type="checkbox" name="area" value="computacao">
            Computação
        </label>

        <label>
            <input type="checkbox" name="area" value="biologia">
            Biologia
        </label>

        <label>
            <input type="checkbox" name="area" value="meio-ambiente">
            Meio Ambiente
        </label>

        <label>
            <input type="checkbox" name="area" value="engenharia">
            Engenharia
        </label>

        <label>
            <input type="checkbox" name="area" value="historia">
            História
        </label>

        <br><br>

       <!-- Campo para escrever um mini curriculo -->

 <label for="curriculo">Mini-currículo:</label>

        <textarea id="curriculo" name="curriculo"
                  rows="6" cols="40"></textarea>

    </fieldset>

    <br>
     
      <!-- Campo para botões de enviar ou limpar -->
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">

</form>

</body>
</html>
