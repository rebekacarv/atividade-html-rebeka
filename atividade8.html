<<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
</head>
<body>

   <h2>Cadastro de alunos</h2>

   <form action="#" method="POST">

    <!-- Campo para nome -->
    <p>
      <label for="nome">Nome do Aluno:</label><br>
      <input type="text" id="nome" name="nome" placeholder="digite seu nome" required>
    </p>

    <!-- Campo para E-mail -->
    <p>
      <label for="email">Email do aluno:</label><br>
      <input type="email" id="email" name="email"
             placeholder="seuemail@exemplo.com" required>
    </p>

    <!-- Campo para senha -->
    <p>
      <label for="senha">Senha de Acesso:</label><br>
      <input type="password" id="senha" name="senha" required>
    </p>

    <!-- Nova opção: Curso -->
    <p>
      <label for="curso">Curso:</label><br>
      <select id="curso" name="curso">
        <option value="informatica">Informática</option>
        <option value="administracao">Administração</option>
        <option value="enfermagem">Enfermagem</option>
        <option value="contabilidade">Contabilidade</option>
      </select>
    </p>

    <!-- Campo de seleção -->
    <p>
      <label for="assunto">Assunto:</label><br>
      <select id="assunto" name="assunto">
        <option value="Informática">Dúvida</option>
        <option value="Atividade">Sugestão</option>
        <option value="Duvida">Suporte</option>
      </select>
    </p>

    <!-- Caixa de texto grande -->
    <p>
      <label for="mensagem">Comentário:</label><br>
      <textarea id="mensagem" name="mensagem" rows="4" cols="30"
                placeholder="Digite seu comentário..."></textarea>
    </p>

    <!-- Botão de envio -->
    <p>
      <button type="submit">Cadastrar</button>
      <button type="reset">Limpar Campos</button>
    </p>

   </form>

</body>
</html>
